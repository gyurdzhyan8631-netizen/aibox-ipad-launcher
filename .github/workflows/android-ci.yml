name: Android CI Build
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {java-version: '17', distribution: temurin}
    - name: Build and release
      env:
        GH_TOKEN: ${{ github.token }}
        AIBOX_RELEASE_KEYSTORE: ${{ secrets.AIBOX_RELEASE_KEYSTORE }}
        AIBOX_RELEASE_KEYSTORE_B64: ${{ secrets.AIBOX_RELEASE_KEYSTORE_B64 }}
        AIBOX_RELEASE_STORE_PASSWORD: ${{ secrets.AIBOX_RELEASE_STORE_PASSWORD }}
        AIBOX_RELEASE_KEY_ALIAS: ${{ secrets.AIBOX_RELEASE_KEY_ALIAS }}
        AIBOX_RELEASE_KEY_PASSWORD: ${{ secrets.AIBOX_RELEASE_KEY_PASSWORD }}
      run: |
        set -e
        if [ -f patch.zip ]; then
          unzip -oq patch.zip -d /tmp/p
          while IFS= read -r p || [ -n "$p" ]; do
            case "$p" in ''|/*|*..*) continue;; esac
            rm -rf -- "$p"
          done < /tmp/p/.apply-delete.txt
          rm -f /tmp/p/.apply-delete.txt
          cp -a /tmp/p/. .
          rm -rf /tmp/p patch.zip
        fi
        keytool -genkeypair -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 36500 -dname 'CN=Android Debug,O=Android,C=US' 2>/dev/null || true
        B=$(grep '^versionCode' version.properties | grep -o '[0-9]*')
        C=$(( ${B:-1300} + ${{ github.run_number }} ))
        N=$(sed -n 's/^versionName=//p' version.properties)
        ./gradlew assembleDebug assembleRelease --console=plain -PciBuild=$C
        cp app/build/outputs/apk/debug/*.apk d.apk
        cp app/build/outputs/apk/release/*.apk r.apk
        bash scripts/generate-update-manifest.sh d.apk r.apk "$C" "$N" "build-${{ github.run_number }}"
        T=build-${{ github.run_number }}
        gh release create "$T" d.apk r.apk update-manifest.json SHA256SUMS --title "$T" --notes "$(git log -1 --pretty=%s)" --latest || gh release upload "$T" d.apk r.apk update-manifest.json SHA256SUMS --clobber
